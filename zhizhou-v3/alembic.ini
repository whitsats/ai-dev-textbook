# Keep this file ASCII-only. Alembic reads alembic.ini with the *locale* encoding
# (configparser's default), not UTF-8. On a zh-CN Windows box that is GBK, and a single
# Chinese comment here aborts every `alembic` command with UnicodeDecodeError.
# Put notes in migrations/env.py instead -- Python source is read as UTF-8.
#
# The database URL is NOT here either: it lives in the APP_DB environment variable,
# because this file goes into version control and connection strings carry passwords.
[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
