name: 教材校验

# 目的：本机钩子可能被 SKIP_BOOK_CHECKS=1 或 --no-verify 绕过，
# CI 是最后一道门——正文校验与链接校验都在这里强制跑一遍。
#
# 说明：链接校验需要访问外网。它把「失效」视为失败（退出码 1），
# 把「跳转」只作为提示打印（文档换域名时应更新 REFERENCES.md）。

on:
  push:
    paths:
      - "book/**"
      - "*.md"
      - "tools/**"
      - ".githooks/**"
      - ".github/workflows/book-checks.yml"
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: 正文一致性校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 脚本只用标准库，无需 pip install
      - name: 语法自检（工具脚本）
        run: python -m compileall -q tools
      - name: 工具自检（字数口径 / 对账门 / 汇总数字夹具 / 题库索引夹具 / 正文↔树）
        run: |
          python tools/lint_book.py --self-test
          python tools/audit_coverage.py --self-test
          python tools/totals.py --self-test
          python tools/bank_index.py --self-test
          python tools/backend_index.py --self-test
          python tools/mobile_index.py --self-test
          python tools/mock_round.py --self-test
          python tools/index_book.py --self-test
          python tools/check_runnable.py --self-test
          python tools/revisit.py --self-test
          python tools/appendix.py --self-test
          python tools/crosscheck.py --self-test
          python tools/learning_path.py --self-test
      - name: 校验正文（体例 / 术语 / 术语日志对账 / 引用 / 篇幅 / 重复）
        run: python tools/lint_book.py
      - name: 文档数字对账（PLAN / COVERAGE vs 实测）
        run: python tools/audit_coverage.py --check
      # 汇总数字（台账篇级进度 / 看板与文首 / README / COVERAGE）由 tools/totals.py 生成，
      # 这一关拦的是「忘了跑 --sync」与「手改了一个格子」——两者都会让某一笔提交
      # 自己跑不过门（见 STYLE 8.11）。
      - name: 汇总数字对账（单一来源 vs 文档）
        run: python tools/totals.py --check
      # 第 10 篇没有可运行树，这一关是它的「可运行」那一层：
      # 考点索引由脚本从题库算出来，而正文那两张表必须逐行等于算出来的值。
      - name: 题库索引对账（第 10 篇：专题／题数／考点数／归属）
        run: python tools/bank_index.py --check
      # 10.5 换了一份题库（Java 体系），而这一关多一条：每个板块的处置也要对上。
      - name: 后端题库的岗位视角索引（第 10 篇：板块／处置／难度／题面关键词）
        run: python tools/backend_index.py --check
      # 10.6 第一次同时面对两份题库，多两组读数：素材可用性与两列反向索引。
      - name: 移动端两份题库的索引（第 10 篇：地形图／处置／素材可用性／反向索引）
        run: python tools/mobile_index.py --check
      # 10.7 没有外部题源：这一关守的是「这一章自己定的口径（时间、评分、失败模式）与正文相等」。
      - name: 模拟面试与复盘（第 10 篇：时间账／追问穿透／评分／失败模式）
        run: python tools/mock_round.py --check
      # 全书索引是**生成物**：这一关抢「书稿改了而索引没重生」，
      # 以及「术语表登记了、而书里一次都没用到」的词条。
      - name: 全书索引（术语 → 章节 / 树与门脚本 → 章节 / 小节目录）
        run: python tools/index_book.py --check
      # 通读普查：十段式里「标题固定」的元素实际被写成了几种形状、坑条数怎么分布。
      # 这一关抢的是「改了某一章的形状而 REVISIT.md 没跟」——形状的取舍由人定，
      # 但**记录的现状与实际不一致**是不允许的（与 index_book 同一个形状）。
      - name: 通读普查（体例形状 / 常见坑条数，与 REVISIT.md 逐行比）
        run: python tools/revisit.py --check
      # 附录是三张表（六棵树速查 / 门脚本速查 / 总量与复算入口），全是生成物。
      # 它比 index_book 多守一件事：**新增一支工具或一个入口脚本而附录没重生**。
      - name: 附录（六棵树速查 / 门脚本速查 / 总量与复算入口）
        run: python tools/appendix.py --check
      # 分层学习计划：四层起点、每层的章集合与派生读数全是生成物。
      # 它多守一件事：**前置闭合**——某章点到的前置既要不在本层、又不在「假定已具备」里，
      # 那就是把读者扔在半路，而四张表各自看着都是完整的（与 index_book 同一个形状）。
      - name: 分层学习计划（四层起点 / 前置闭合 / 并集 ＝ 全书）
        run: python tools/learning_path.py --check
      # 跨篇结论对账：已判过的「同一条结论」逐格去盘上复算。
      # **分歧不拦提交**（本书确实还有两条结论在几篇里说法不一），
      # 拦的是清单自身的三种错：那一处已不在正文里、正文改了清单没跟、判定与实跑反了。
      - name: 跨篇结论对账（出处 / 计数 / 普查计数，与 CROSSCHECK.md 逐行比）
        run: python tools/crosscheck.py --check

  runnable:
    name: 可运行树一致性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 这一关要真的 import 得动那份代码，所以得装依赖；仍然不需要任何密钥。
      # **有 requirements.txt 的每一棵树都要装**：v3 是手写版（httpx / pydantic /
      # fastapi / sqlalchemy），v4 与 v5 是框架版（langchain / langgraph，及 v5 的
      # 五个解析库），v6–v8 零依赖（没有这份文件）。
      # 只装前两棵的话，v5 的解析路径在 CI 里会报 ModuleNotFoundError——本机因为
      # 全局装过，看不出这个问题。**2026-09-22 就是这么发现的：门在本机绿、在 GitHub
      # 红，红的那一边正好是「照不到的那一边」**（与 STYLE 8.5 里那条同一个形状）。
      - name: 安装参考实现的依赖（有 requirements.txt 的每一棵树）
        run: |
          for req in zhizhou-*/requirements.txt; do
            echo "── $req"
            pip install -r "$req"
          done
      - name: 正文代码块 ↔ 可运行树 一致性与离线自检（六棵树）
        run: python tools/check_runnable.py
      # pytest 只跑**自己在 requirements.txt 里声明了它**的那几棵树：v6–v8 是零依赖
      # 树，它们的测试由上面那条 `check_runnable.py` 用自己的驱动跑（那才是本书的
      # 验收口径，不需要 pytest）。名单从盘上派生，免得往后加一棵树就漏一棵。
      - name: 参考实现的测试（pytest，声明了它的那几棵树）
        run: |
          for req in zhizhou-*/requirements.txt; do
            grep -q '^pytest' "$req" || continue
            tree=${req%/requirements.txt}
            echo "── $tree"
            (cd "$tree" && python -m pytest -q)
          done

  refs:
    name: 官方文档链接校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 校验 REFERENCES.md 中的链接
        run: python tools/check_refs.py --only-broken

  hooks:
    name: 钩子安装脚本自检
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装钩子并验证它确实会拦下违规提交
        run: |
          python tools/install_hooks.py
          python tools/install_hooks.py --self-test
