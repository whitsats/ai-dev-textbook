name: 教材校验

# 目的：本机钩子可能被 SKIP_BOOK_CHECKS=1 或 --no-verify 绕过，
# CI 是最后一道门——正文校验与链接校验都在这里强制跑一遍。
#
# 说明：链接校验需要访问外网。它把「失效」视为失败（退出码 1），
# 把「跳转」只作为提示打印（文档换域名时应更新 REFERENCES.md）。

on:
  push:
    paths:
      - "book/**"
      - "*.md"
      - "tools/**"
      - ".githooks/**"
      - ".github/workflows/book-checks.yml"
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: 正文一致性校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 脚本只用标准库，无需 pip install
      - name: 语法自检（工具脚本）
        run: python -m compileall -q tools
      - name: 工具自检（字数口径 / 对账门 / 汇总数字夹具 / 题库索引夹具）
        run: |
          python tools/lint_book.py --self-test
          python tools/audit_coverage.py --self-test
          python tools/totals.py --self-test
          python tools/bank_index.py --self-test
          python tools/backend_index.py --self-test
          python tools/mobile_index.py --self-test
      - name: 校验正文（体例 / 术语 / 术语日志对账 / 引用 / 篇幅 / 重复）
        run: python tools/lint_book.py
      - name: 文档数字对账（PLAN / COVERAGE vs 实测）
        run: python tools/audit_coverage.py --check
      # 汇总数字（台账篇级进度 / 看板与文首 / README / COVERAGE）由 tools/totals.py 生成，
      # 这一关拦的是「忘了跑 --sync」与「手改了一个格子」——两者都会让某一笔提交
      # 自己跑不过门（见 STYLE 8.11）。
      - name: 汇总数字对账（单一来源 vs 文档）
        run: python tools/totals.py --check
      # 第 10 篇没有可运行树，这一关是它的「可运行」那一层：
      # 考点索引由脚本从题库算出来，而正文那两张表必须逐行等于算出来的值。
      - name: 题库索引对账（第 10 篇：专题／题数／考点数／归属）
        run: python tools/bank_index.py --check
      # 10.5 换了一份题库（Java 体系），而这一关多一条：每个板块的处置也要对上。
      - name: 后端题库的岗位视角索引（第 10 篇：板块／处置／难度／题面关键词）
        run: python tools/backend_index.py --check
      # 10.6 第一次同时面对两份题库，多两组读数：素材可用性与两列反向索引。
      - name: 移动端两份题库的索引（第 10 篇：地形图／处置／素材可用性／反向索引）
        run: python tools/mobile_index.py --check

  runnable:
    name: 可运行树一致性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 这一关要真的 import 得动那份代码，所以得装依赖；仍然不需要任何密钥。
      # **两棵树都要装**：v3 是手写版（httpx / pydantic / fastapi），
      # v4 是框架版（langchain / langgraph）。只装一棵的话，另一棵的全部模块
      # 在 CI 里都会报 ModuleNotFoundError——本机因为全局装过，看不出这个问题。
      - name: 安装参考实现依赖（两棵树）
        run: |
          pip install -r zhizhou-v3/requirements.txt
          pip install -r zhizhou-v4/requirements.txt
      - name: 正文代码块 ↔ 可运行树 一致性与离线自检（v3 + v4）
        run: python tools/check_runnable.py
      - name: 参考实现的测试（pytest，两棵树）
        run: |
          cd zhizhou-v3 && python -m pytest -q
          cd ../zhizhou-v4 && python -m pytest -q

  refs:
    name: 官方文档链接校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 校验 REFERENCES.md 中的链接
        run: python tools/check_refs.py --only-broken

  hooks:
    name: 钩子安装脚本自检
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装钩子并验证它确实会拦下违规提交
        run: |
          python tools/install_hooks.py
          python tools/install_hooks.py --self-test
