<body>
  <h1>知舟架构概览</h1>
  <p>知舟是本书贯穿始终的教学项目。它由三层组成：知识层、运行时层与在线层。</p>

  <h2>知识层</h2>
  <p>知识层负责语料、解析、切分、嵌入、索引与入库报告。它是唯一有“重新生成”成本的一层。</p>

  <h2>运行时层</h2>
  <p>运行时层负责检索、重排、判档与生成。它不持久化任何东西，每次请求从知识层取片。</p>

  <h2>在线层</h2>
  <p>在线层负责缓存、并发闸门、事件流、成本账与观测。它是在线唯一有“状态”的一层。</p>
</body>
</html>
